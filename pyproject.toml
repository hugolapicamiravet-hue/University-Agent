[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "university-agent"
version = "0.1.0"
description = "A foundation for a personal UJI university assistant."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "ollama>=0.6,<1",
    "openai>=3,<4",
    "pypdf>=6,<7",
]

[project.scripts]
university-agent = "university_agent.cli:main"

[project.urls]
Repository = "https://github.com/hugolapicamiravet-hue/University-Agent"
Issues = "https://github.com/hugolapicamiravet-hue/University-Agent/issues"

[tool.setuptools.packages.find]
where = ["src"]
