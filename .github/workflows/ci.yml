name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/university-agent-wheel"
          "$RUNNER_TEMP/university-agent-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/university-agent-wheel/bin/university-agent" --help
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/university-agent-wheel/bin/python" -c "import university_agent.cli"
